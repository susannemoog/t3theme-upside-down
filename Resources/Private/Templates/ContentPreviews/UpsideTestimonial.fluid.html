<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<style>
.ud-slider__item        { border: 1px solid #1a2d3e; border-radius: 0.75rem; padding: 1.2rem; max-width: 320px; font-family: system-ui, sans-serif; color: #e8eff6; }
.ud-slider__kicker      { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: #2dbfb0; margin: 0 0 0.25rem; }
.ud-slider__name        { font-size: 1rem; color: #e8eff6; margin: 0 0 0.9rem; }
.ud-slider__quote       { margin: 0 0 0.75rem; border-left: 3px solid #c41c35; padding-left: 0.85rem; }
.ud-slider__quote p     { font-size: 0.88rem; color: #d3dbff; line-height: 1.6; margin: 0 0 0.3rem; font-style: italic; }
.ud-slider__quote cite  { font-size: 0.72rem; color: #e84055; font-style: normal; }
.ud-slider__meta        { display: flex; gap: 0.75rem; flex-wrap: wrap; }
.ud-slider__meta span   { font-size: 0.72rem; color: #d3dbff; }
</style>

<div class="ud-slider__item" style="background:#0f1c27;">
  <div>
    <f:if condition="{record.subheader}">
      <p class="ud-slider__kicker">{record.subheader}</p>
    </f:if>
    <h3 class="ud-slider__name">{record.header}</h3>
  </div>
  <blockquote class="ud-slider__quote">
    <f:if condition="{record.bodytext}">
      <p>{record.bodytext -> f:format.stripTags() -> f:format.crop(maxCharacters: 140)}</p>
    </f:if>
    <f:if condition="{record.tx_themeupsidedown_testimonial_citation}">
      <cite>{record.tx_themeupsidedown_testimonial_citation}</cite>
    </f:if>
  </blockquote>
  <div class="ud-slider__meta">
    <f:if condition="{record.tx_themeupsidedown_testimonial_location}">
      <span>{record.tx_themeupsidedown_testimonial_location}</span>
    </f:if>
    <f:if condition="{record.tx_themeupsidedown_testimonial_clearance}">
      <span>{record.tx_themeupsidedown_testimonial_clearance}</span>
    </f:if>
  </div>
</div>
</html>
