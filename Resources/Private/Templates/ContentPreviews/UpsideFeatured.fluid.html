<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<div class="ud-featured__card" style="max-width: 480px;">
  <div class="ud-featured__body" style="padding: 1.2rem;">
    <f:if condition="{record.header}">
      <span class="ud-featured__dispatch">{record.header}</span>
    </f:if>
    <f:if condition="{record.subheader}">
      <h2 class="ud-featured__title" style="font-size: 1.1rem; margin: 0.4rem 0;">{record.subheader}</h2>
    </f:if>
    <f:if condition="{record.bodytext}">
      <p style="font-size: 0.82rem; color: var(--ud-text-muted, #d3dbff); margin: 0.4rem 0; line-height: 1.5;">{record.bodytext -> f:format.stripTags() -> f:format.crop(maxCharacters: 100)}</p>
    </f:if>
    <f:if condition="{record.tx_themeupsidedown_cta_label}">
      <span class="ud-featured__cta" style="font-size: 0.82rem;">{record.tx_themeupsidedown_cta_label} →</span>
    </f:if>
  </div>
</div>
</html>
