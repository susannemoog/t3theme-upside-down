<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<style>
.ud-hero-preview { border: 1px solid #1a2d3e; border-top: 4px solid; border-image: linear-gradient(90deg,#2dbfb0,#c41c35) 1; border-radius: 0.75rem; overflow: hidden; max-width: 560px; font-family: system-ui, sans-serif; }
.ud-hero-preview__inner { padding: 1.4rem 2rem; }
.ud-hero-preview__kicker { font-size: 0.68rem; color: #2dbfb0; text-transform: uppercase; letter-spacing: 0.15em; margin: 0 0 0.4rem; font-family: monospace; display: block; }
.ud-hero-preview__title  { font-size: clamp(1.4rem,4vw,2.2rem); color: #ffffff; margin: 0 0 0.5rem; line-height: 1.1; font-family: Georgia, serif; font-weight: 400; }
.ud-hero-preview__body   { font-size: 0.82rem; color: #d3dbff; margin: 0; line-height: 1.5; max-width: 50ch; }
</style>

<div class="ud-hero-preview" style="background:#06090d;">
  <div class="ud-hero-preview__inner">
    <f:if condition="{record.header}">
      <span class="ud-hero-preview__kicker">{record.header}</span>
    </f:if>
    <f:if condition="{record.subheader}">
      <h1 class="ud-hero-preview__title">{record.subheader}</h1>
    </f:if>
    <f:if condition="{record.bodytext}">
      <p class="ud-hero-preview__body">{record.bodytext -> f:format.stripTags() -> f:format.crop(maxCharacters: 100)}</p>
    </f:if>
  </div>
</div>
</html>
