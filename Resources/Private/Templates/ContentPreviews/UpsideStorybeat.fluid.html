<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<style>
.ud-storybeat-preview        { border: 1px solid #5c2c8a; border-radius: 0.5rem; padding: 0.9rem 1.1rem; max-width: 480px; font-family: system-ui, sans-serif; color: #f6ecff; }
.ud-storybeat-preview__title { font-size: 0.96rem; font-weight: 700; color: #f6ecff; margin: 0 0 0.25rem; }
.ud-storybeat-preview__sub   { font-size: 0.82rem; color: rgba(246,236,255,0.8); margin: 0 0 0.4rem; }
.ud-storybeat-preview__body  { font-size: 0.82rem; color: rgba(246,236,255,0.85); line-height: 1.5; margin: 0; }
</style>

<div class="ud-storybeat-preview" style="background:#180d28;">
  <f:if condition="{record.header}">
    <p class="ud-storybeat-preview__title">{record.header}</p>
  </f:if>
  <f:if condition="{record.subheader}">
    <p class="ud-storybeat-preview__sub">{record.subheader}</p>
  </f:if>
  <f:if condition="{record.bodytext}">
    <p class="ud-storybeat-preview__body">{record.bodytext -> f:format.stripTags() -> f:format.crop(maxCharacters: 160)}</p>
  </f:if>
</div>
</html>
