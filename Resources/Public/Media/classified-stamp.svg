  <!-- Corner ticks (decorative) -->
  <line x1="28" y1="28" x2="38" y2="28" stroke="#cc2200" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="28" y1="28" x2="28" y2="38" stroke="#cc2200" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="172" y1="28" x2="162" y2="28" stroke="#cc2200" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="172" y1="28" x2="172" y2="38" stroke="#cc2200" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="28" y1="172" x2="38" y2="172" stroke="#cc2200" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="28" y1="172" x2="28" y2="162" stroke="#cc2200" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="172" y1="172" x2="162" y2="172" stroke="#cc2200" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="172" y1="172" x2="172" y2="162" stroke="#cc2200" stroke-width="1.5" stroke-opacity="0.5"/>
