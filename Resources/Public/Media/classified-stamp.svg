  <line x1="38" y1="107" x2="162" y2="107" stroke="#cc2200" stroke-width="1" stroke-opacity="0.55"/>
  <line x1="48" y1="111" x2="152" y2="111" stroke="#cc2200" stroke-width="0.6" stroke-opacity="0.35"/>

  <!-- Level text -->
