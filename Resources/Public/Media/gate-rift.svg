<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <defs>
    <linearGradient id="rift-grad-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dbfb0"/>
      <stop offset="100%" stop-color="#c41c35"/>
    </linearGradient>
    <linearGradient id="rift-grad-red" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c41c35"/>
      <stop offset="100%" stop-color="#2dbfb0"/>
    </linearGradient>
    <radialGradient id="rift-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dbfb0" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#c41c35" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Core glow -->
  <ellipse cx="400" cy="400" rx="60" ry="60" fill="url(#rift-core)"/>

  <!-- Concentric rings -->
  <ellipse cx="400" cy="400" rx="80"  ry="52"  stroke="url(#rift-grad-teal)" stroke-width="1.4" opacity="0.9"/>
  <ellipse cx="400" cy="400" rx="140" ry="90"  stroke="url(#rift-grad-red)"  stroke-width="1.0" opacity="0.75"/>
  <ellipse cx="400" cy="400" rx="200" ry="130" stroke="url(#rift-grad-teal)" stroke-width="0.8" opacity="0.6"/>
  <ellipse cx="400" cy="400" rx="270" ry="174" stroke="url(#rift-grad-red)"  stroke-width="0.7" opacity="0.45"/>
  <ellipse cx="400" cy="400" rx="340" ry="220" stroke="url(#rift-grad-teal)" stroke-width="0.5" opacity="0.3"/>
  <ellipse cx="400" cy="400" rx="380" ry="248" stroke="url(#rift-grad-red)"  stroke-width="0.4" opacity="0.2"/>

  <!-- Radial crack lines -->
  <path d="M400 400 C390 350, 370 290, 355 220" stroke="url(#rift-grad-teal)" stroke-width="0.9" opacity="0.7"/>
  <path d="M400 400 C425 352, 462 304, 498 240" stroke="url(#rift-grad-red)"  stroke-width="0.7" opacity="0.55"/>
  <path d="M400 400 C444 415, 500 430, 568 452" stroke="url(#rift-grad-teal)" stroke-width="0.8" opacity="0.65"/>
  <path d="M400 400 C430 440, 460 490, 488 555" stroke="url(#rift-grad-red)"  stroke-width="0.7" opacity="0.5"/>
  <path d="M400 400 C395 448, 388 505, 378 578" stroke="url(#rift-grad-teal)" stroke-width="0.6" opacity="0.45"/>
  <path d="M400 400 C368 438, 330 468, 282 504" stroke="url(#rift-grad-red)"  stroke-width="0.8" opacity="0.6"/>
  <path d="M400 400 C355 415, 295 428, 222 440" stroke="url(#rift-grad-teal)" stroke-width="0.7" opacity="0.55"/>
  <path d="M400 400 C362 368, 318 330, 268 282" stroke="url(#rift-grad-red)"  stroke-width="0.6" opacity="0.5"/>

  <!-- Secondary fine cracks -->
  <path d="M400 400 C412 360, 438 318, 470 265" stroke="#2dbfb0" stroke-width="0.4" opacity="0.35"/>
  <path d="M400 400 C380 358, 352 312, 316 252" stroke="#c41c35" stroke-width="0.4" opacity="0.3"/>
  <path d="M400 400 C445 395, 502 388, 570 378" stroke="#2dbfb0" stroke-width="0.35" opacity="0.28"/>
  <path d="M400 400 C443 428, 495 460, 558 498" stroke="#c41c35" stroke-width="0.35" opacity="0.28"/>
  <path d="M400 400 C346 425, 282 446, 204 468" stroke="#2dbfb0" stroke-width="0.4" opacity="0.32"/>

  <!-- Outer atmosphere haze -->
  <ellipse cx="400" cy="400" rx="395" ry="256" stroke="url(#rift-grad-teal)" stroke-width="0.3" opacity="0.12" stroke-dasharray="4 8"/>
</svg>
