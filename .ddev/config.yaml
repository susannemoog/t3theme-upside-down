type: typo3
docroot: Build/public
composer_root: Build
php_version: "8.4"
webserver_type: apache-fpm
database:
  type: mariadb
  version: "10.11"
composer_version: "2"
nodejs_version: "22"
xdebug_enabled: false
disable_settings_management: true

web_environment:
  - TYPO3_CONTEXT=Development
  - TYPO3_DB_DRIVER=mysqli
  - TYPO3_DB_HOST=db
  - TYPO3_DB_PORT=3306
  - TYPO3_DB_DBNAME=db
  - TYPO3_DB_USERNAME=db
  - TYPO3_DB_PASSWORD=db
  - TYPO3_PROJECT_NAME=Upside Down
  - TYPO3_SETUP_ADMIN_USERNAME=admin
  - TYPO3_SETUP_ADMIN_PASSWORD=Password.1
  - TYPO3_SETUP_ADMIN_EMAIL=admin@example.com
  # Backend login branding (override in config.local.yaml or .ddev/.env)
  - TYPO3_BE_LOGIN_LOGO=EXT:theme_upside_down/Resources/Public/Media/gate-rift.svg
  - TYPO3_BE_LOGIN_BG_IMAGE=EXT:theme_upside_down/Resources/Public/Media/portal-forest.svg
  - TYPO3_BE_LOGIN_HIGHLIGHT_COLOR=#b52b2b

hooks:
  post-start:
    - exec: bash /var/www/html/.ddev/scripts/setup-typo3.sh
